name: "Terraform CD (Apply Infrastructure)"

on:
  # Triggers automatically after CI successfully completes on main
  workflow_run:
    workflows: ["Terraform CI (Validate & Plan)"]
    branches:
      - main
    types:
      - completed
  # Manual trigger option
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform (apply / destroy)"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read
  actions: read

jobs:
  terraform-cd:
    name: "Deploy from Artifact"
    runs-on: ubuntu-latest
    # Only run if manual trigger OR if the upstream CI run on main succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    # Service Principal Authentication using Client ID & Client Secret (No OIDC)
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      # 1. Initialize Terraform with Azure Remote State Backend (defined in backend.tf)
      - name: Terraform Init
        run: terraform init

      # 2. Download and Restore Plan Artifact from upstream CI run
      - name: Retrieve Plan Artifact from CI
        id: retrieve-plan
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 3. Verify Artifact Availability
      - name: Check Artifact Status
        run: |
          if [ -f "tfplan" ]; then
            echo "tfplan artifact found and restored from CI."
            echo "HAS_PLAN=true" >> $GITHUB_ENV
          else
            echo "tfplan file not found; will generate plan if needed."
            echo "HAS_PLAN=false" >> $GITHUB_ENV
          fi

      # 4. Fallback Plan Generation (if no artifact found or on manual dispatch)
      - name: Generate Fallback Plan
        if: ${{ (github.event_name == 'workflow_run' || github.event.inputs.action == 'apply') && env.HAS_PLAN != 'true' }}
        run: |
          echo "Generating fresh speculative plan..."
          terraform plan -out=tfplan

      # 5. Terraform Apply using the Plan Artifact
      - name: Terraform Apply
        if: ${{ github.event_name == 'workflow_run' || github.event.inputs.action == 'apply' }}
        run: |
          echo "Applying infrastructure using tfplan..."
          terraform apply -auto-approve tfplan

      # 6. Manual Infrastructure Destruction (workflow_dispatch only)
      - name: Terraform Destroy
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' }}
        run: terraform destroy -auto-approve
