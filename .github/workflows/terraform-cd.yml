name: "Terraform CD (Apply Infrastructure)"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform (apply / destroy)"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read
  actions: read

jobs:
  terraform-cd:
    name: "Deploy from Artifact"
    runs-on: ubuntu-latest

    # Service Principal Authentication using Client ID & Client Secret (No OIDC)
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      # 1. Initialize Terraform with Azure Remote State Backend (defined in backend.tf)
      - name: Terraform Init
        run: terraform init

      # 2. Download and Restore Plan Artifact from CI
      - name: Retrieve Plan Artifact from CI
        id: retrieve-plan
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply') }}
        run: |
          echo "Finding the latest successful CI run containing the tfplan artifact..."
          CI_RUN_ID=$(gh run list --workflow "Terraform CI (Validate & Plan)" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')

          if [ -n "$CI_RUN_ID" ]; then
            echo "Attempting download from CI Run ID: $CI_RUN_ID"
            if gh run download "$CI_RUN_ID" --name tfplan --dir .; then
              echo "Plan artifact successfully downloaded from CI."
              echo "HAS_PLAN=true" >> $GITHUB_ENV
            else
              echo "Could not download artifact from Run ID $CI_RUN_ID."
              echo "HAS_PLAN=false" >> $GITHUB_ENV
            fi
          else
            echo "No previous successful CI run found."
            echo "HAS_PLAN=false" >> $GITHUB_ENV
          fi

      # 3. Fallback Plan Generation (only if no artifact found)
      - name: Generate Fallback Plan
        if: ${{ (github.event_name == 'push' || github.event.inputs.action == 'apply') && env.HAS_PLAN != 'true' }}
        run: |
          echo "Generating fresh speculative plan..."
          terraform plan -out=tfplan

      # 4. Terraform Apply using the Plan Artifact
      - name: Terraform Apply
        if: ${{ github.event_name == 'push' || github.event.inputs.action == 'apply' }}
        run: |
          echo "Applying infrastructure using tfplan artifact..."
          terraform apply -auto-approve tfplan

      # 5. Manual Infrastructure Destruction (workflow_dispatch only)
      - name: Terraform Destroy
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' }}
        run: terraform destroy -auto-approve
